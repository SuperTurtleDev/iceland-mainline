name: main build

# Structure:
#   checkout (前置, once for the whole workflow)
#     └─> bl-kernel   ─┐  (buildbl -> buildkernel; initrd embeds bl's esp.img)
#     └─> userspace   ─┤  (rootfs sparse image, compressed for upload)
#            package  <┘  (deploy blob + ramdeploy bundle, single artifact)

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bl-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: reclaim disk (kernel tree + container are heavy)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                       /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: clone main + kernel (recursive) + bl + container
        run: |
          git clone --depth 1 https://github.com/SuperTurtleDev/iceland-mainline.git .
          git clone --depth 1 --recursive --shallow-submodules \
            https://github.com/SuperTurtleDev/iceland-mainline-kernel.git kernel
          git clone --depth 1 --recursive --shallow-submodules \
            https://github.com/SuperTurtleDev/iceland-mainline-bootloader.git bootloader
          git clone --depth 1 \
            https://github.com/SuperTurtleDev/iceland-build-container.git podman_container

      - name: rootless podman prereqs
        run: |
          sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$USER"
          podman info >/dev/null && echo podman-ok

      - name: buildbl.sh
        run: bash scripts/buildbl.sh

      - name: "buildkernel.sh (after bl — initrd embeds bl's esp.img)"
        run: bash scripts/buildkernel.sh

      - name: stage products
        run: |
          K=../build/kernel
          mkdir -p out/kernel out/bootloader
          cp "$K"/SHA256SUMS out/kernel/ 2>/dev/null || true
          cp "$K"/*.img "$K"/*.tar.gz out/kernel/ 2>/dev/null || true
          cp "$K"/initrd_deploy_net_*.cpio.zst out/kernel/ 2>/dev/null || true
          cp -r "$K"/debs "$K"/tools "$K"/ramdeploy "$K"/charge out/kernel/ 2>/dev/null || true
          BL=../build/bootloader
          cp "$BL"/TestBootApp.efi "$BL"/BootApp.efi "$BL"/BootUtil.efi "$BL"/esp.img \
             out/bootloader/ 2>/dev/null || true
          du -sh out

      - uses: actions/upload-artifact@v4
        with:
          name: products-bl-kernel
          retention-days: 3
          path: out

  userspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: clone main + userspace
        run: |
          git clone --depth 1 https://github.com/SuperTurtleDev/iceland-mainline.git .
          git clone --depth 1 --recursive --shallow-submodules \
            https://github.com/SuperTurtleDev/iceland-mainline-userspace.git userspace

      - name: qemu-user-static (arm64 emulation for debootstrap)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends qemu-user-static
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
          ls /proc/sys/fs/binfmt_misc/ | grep -i aarch64

      - name: builduserspace.sh
        run: bash scripts/builduserspace.sh

      - name: stage products (compressed sparse image + info)
        run: |
          U=../build/userspace
          mkdir -p out/userspace
          # compress each sparse image for upload (sparse ext4 has lots of
          # zeros; zstd typically halves the size)
          for img in "$U"/*.sparse.img; do
            [ -f "$img" ] || continue
            zstd -3 -T0 -q -o "out/userspace/$(basename "$img").zst" "$img"
            echo "compressed: $(du -h "out/userspace/$(basename "$img").zst")"
          done
          ( cd "$U" 2>/dev/null && sha256sum *.sparse.img *.img 2>/dev/null ) \
            > out/userspace/SHA256SUMS.images || true
          cp "$U"/SHA256SUMS "$U"/buildinfo.txt out/userspace/ 2>/dev/null || true
          du -sh out/userspace/

      - uses: actions/upload-artifact@v4
        with:
          name: products-userspace
          retention-days: 3
          path: out

  package:
    needs: [bl-kernel, userspace]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with: { name: products-bl-kernel, path: products }
      - uses: actions/download-artifact@v4
        with: { name: products-userspace, path: products }

      - name: assemble deploy bundle (blob + ramdeploy)
        run: |
          set -e
          # decompress the sparse rootfs
          mkdir -p work
          for zst in products/userspace/*.sparse.img.zst; do
            [ -f "$zst" ] || continue
            base="${zst%.zst}"
            zstd -d -T0 -q -o "work/$(basename "$base")" "$zst"
          done
          SPARSE=$(find work -name '*.sparse.img' | head -1)
          echo "rootfs: $SPARSE ($(du -h "$SPARSE" 2>/dev/null || echo '?'))"

          # build the deploy blob (rootfs + 4 kernel debs)
          BLOB=""
          if [ -n "$SPARSE" ] && [ -d products/kernel/debs ] && \
             [ -x products/kernel/tools/makeblob ]; then
            BLOB=deploy.blob
            products/kernel/tools/makeblob -o "work/$BLOB" "$SPARSE" \
              products/kernel/debs/linux-firmware-iceland*_arm64.deb \
              products/kernel/debs/linux-headers-*_arm64.deb \
              products/kernel/debs/linux-image-*_arm64.deb \
              products/kernel/debs/linux-modules-*_arm64.deb
            echo "blob: $(du -h "work/$BLOB")"
          else
            echo "WARNING: cannot build blob (missing sparse/debs/makeblob)"
          fi

          # self-contained ramdeploy bundle
          mkdir -p dist/ramdeploy
          cp products/kernel/ramdeploy/*_ramdeploy.bin dist/ramdeploy/ 2>/dev/null || true
          cp products/bootloader/TestBootApp.efi dist/ramdeploy/ 2>/dev/null || true
          cp products/kernel/tools/deployclient dist/ramdeploy/ 2>/dev/null || true
          [ -n "$BLOB" ] && cp "work/$BLOB" dist/ramdeploy/

          cat > dist/ramdeploy/ramdeploy.sh << 'EOS'
          #!/usr/bin/env bash
          # One-shot RAM deploy: device in TestBootApp fastboot (8B0C705).
          # Run from this directory: ./ramdeploy.sh [deploy.blob] [debug]
          set -eu
          D=$(cd "$(dirname "$0")" && pwd)
          BLOB="${1:-$D/deploy.blob}"
          INITRD=initrd_ramdeploy.bin
          [ "${2:-}" = debug ] && INITRD=initrd_debug_ramdeploy.bin
          fastboot flash bootcfg "$D/bootcfg_ramdeploy.bin"
          fastboot flash kernel   "$D/kernel_ramdeploy.bin"
          fastboot flash dtb      "$D/dtb_ramdeploy.bin"
          fastboot flash initrd   "$D/$INITRD"
          fastboot continue || true
          echo "== waiting for deploy NCM (60 s)..."
          for i in $(seq 15); do ip -o addr show 2>/dev/null | grep -q 'enx.*192.168.42' && break; sleep 4; done
          ip -4 -o addr show | grep 192.168.42 | head -1
          "$D/deployclient" 192.168.42.42 5190 "$BLOB"
          EOS
          chmod +x dist/ramdeploy/ramdeploy.sh

          ( cd dist/ramdeploy && sha256sum TestBootApp.efi *_ramdeploy.bin deployclient deploy.blob ramdeploy.sh > SHA256SUMS 2>/dev/null || \
            ( cd dist/ramdeploy && sha256sum * > SHA256SUMS ) )

          # also ship the kernel deb set alongside for packages-only updates
          mkdir -p dist/kernel-products
          cp -r products/kernel/debs dist/kernel-products/ 2>/dev/null || true
          cp products/kernel/tools/makeblob dist/kernel-products/ 2>/dev/null || true

          du -h dist/ramdeploy/* | tail -5

      - uses: actions/upload-artifact@v4
        with:
          name: iceland-deploy-${{ github.sha }}
          retention-days: 14
          path: dist
