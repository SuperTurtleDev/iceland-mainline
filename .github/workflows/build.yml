name: main build

# Main meta-repo CI.  Two independent chains run in PARALLEL:
#
#   bl-kernel    buildbl.sh -> buildkernel.sh (kernel strictly after bl:
#                the netdeploy initrd embeds bl's esp.img)
#   userspace    builduserspace.sh
#
# The final ramdeploy assembly (blob packing) stays on the workstation
# ./build.sh for now: it needs both chains' outputs on one machine and the
# userspace sparse alone is ~4 GB of cross-job artifact transfer.  The
# kernel artifacts needed for it are uploaded by the bl-kernel job.
#
# Phase scripts that are still owner stubs produce nothing; real build
# failures fail the job.

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bl-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: reclaim disk (kernel tree + container are heavy)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                       /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive   # bootloader, kernel (+linux+firmware), userspace, container

      - name: rootless podman prereqs
        run: |
          sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$USER"
          podman info >/dev/null && echo podman-ok

      - name: buildbl.sh
        run: bash scripts/buildbl.sh

      - name: "buildkernel.sh (after bl — initrd embeds bl's esp.img)"
        run: bash scripts/buildkernel.sh

      - name: collect kernel artifacts
        run: |
          K=../build/kernel
          mkdir -p dist
          cp "$K"/SHA256SUMS dist/ 2>/dev/null || true
          cp "$K"/*.img "$K"/*.tar.gz dist/ 2>/dev/null || true
          cp "$K"/initrd_deploy_net_*.cpio.zst dist/ 2>/dev/null || true
          cp -r "$K"/debs "$K"/tools "$K"/ramdeploy dist/ 2>/dev/null || true
          du -sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: dist

  userspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: builduserspace.sh
        run: bash scripts/builduserspace.sh

      - name: collect userspace artifacts
        run: |
          U=../build/userspace
          mkdir -p dist
          # manifest only: the sparse rootfs images are multi-GB and stay
          # reproducible from the userspace repo build
          ( cd "$U" 2>/dev/null && sha256sum *.sparse.img *.img 2>/dev/null ) > dist/SHA256SUMS.userspace || true
          cp "$U"/SHA256SUMS dist/ 2>/dev/null || true
          cp "$U"/buildinfo.txt dist/ 2>/dev/null || true
          cat dist/SHA256SUMS.userspace 2>/dev/null || echo "no userspace outputs (stub phase?)"

      - uses: actions/upload-artifact@v4
        with:
          name: userspace-${{ github.sha }}
          retention-days: 14
          if-no-files-found: ignore
          path: dist
