name: main build

# Two independent chains in parallel; products gathered by the final job:
#
#   bl-kernel    buildbl.sh -> buildkernel.sh (kernel strictly after bl:
#                the netdeploy initrd embeds bl's esp.img)
#   userspace    builduserspace.sh
#   package      downloads both chains' products -> ONE tar.zst
#
# Each job clones its own repos directly (main repo for scripts/, plus the
# subsystem repos with THEIR own recursive submodules in place, so every
# gitfile resolves naturally -- no workspace tar with nested .git dirs).

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bl-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: reclaim disk (kernel tree + container are heavy)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                       /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: clone main + kernel (recursive) + container
        run: |
          git clone --depth 1 https://github.com/SuperTurtleDev/iceland-mainline.git .
          git clone --depth 1 --recursive --shallow-submodules \
            https://github.com/SuperTurtleDev/iceland-mainline-kernel.git kernel
          git clone --depth 1 --recursive --shallow-submodules \
            https://github.com/SuperTurtleDev/iceland-mainline-bootloader.git bootloader
          git clone --depth 1 \
            https://github.com/SuperTurtleDev/iceland-build-container.git podman_container
          git submodule status

      - name: rootless podman prereqs
        run: |
          sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$USER"
          podman info >/dev/null && echo podman-ok

      - name: buildbl.sh
        run: bash scripts/buildbl.sh

      - name: "buildkernel.sh (after bl — initrd embeds bl's esp.img)"
        run: bash scripts/buildkernel.sh

      - name: stage products
        run: |
          K=../build/kernel
          mkdir -p out/kernel
          cp "$K"/SHA256SUMS out/kernel/ 2>/dev/null || true
          cp "$K"/*.img "$K"/*.tar.gz out/kernel/ 2>/dev/null || true
          cp "$K"/initrd_deploy_net_*.cpio.zst out/kernel/ 2>/dev/null || true
          cp -r "$K"/debs "$K"/tools "$K"/ramdeploy "$K"/charge out/kernel/ 2>/dev/null || true
          # bootloader products for the package job (stub: nothing yet)
          BL=../build/bootloader
          mkdir -p out/bootloader
          cp "$BL"/TestBootApp.efi "$BL"/BootApp.efi "$BL"/BootUtil.efi "$BL"/esp.img \
             out/bootloader/ 2>/dev/null || true
          du -sh out

      - uses: actions/upload-artifact@v4
        with:
          name: products-bl-kernel
          retention-days: 3
          path: out

  userspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: clone main + userspace
        run: |
          git clone --depth 1 https://github.com/SuperTurtleDev/iceland-mainline.git .
          git clone --depth 1 --recursive --shallow-submodules \
            https://github.com/SuperTurtleDev/iceland-mainline-userspace.git userspace

      - name: qemu-user-static (arm64 debootstrap on x86 runners)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends qemu-user-static binfmt-support
          ls /proc/sys/fs/binfmt_misc/ | grep -i aarch64 \
            || sudo update-binfmts --enable qemu-aarch64
          ls /proc/sys/fs/binfmt_misc/ | grep -i aarch64

      - name: builduserspace.sh
        run: bash scripts/builduserspace.sh

      - name: stage products
        run: |
          U=../build/userspace
          mkdir -p out/userspace
          ( cd "$U" 2>/dev/null && sha256sum *.sparse.img *.img 2>/dev/null ) > out/userspace/SHA256SUMS.images || true
          cp "$U"/SHA256SUMS "$U"/buildinfo.txt out/userspace/ 2>/dev/null || true
          cat out/userspace/SHA256SUMS.images 2>/dev/null || echo "no userspace outputs (stub phase?)"

      - uses: actions/upload-artifact@v4
        with:
          name: products-userspace
          retention-days: 3
          if-no-files-found: ignore
          path: out

  package:
    needs: [bl-kernel, userspace]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with: { name: products-bl-kernel, path: products }
      - uses: actions/download-artifact@v4
        with: { name: products-userspace, path: products }

      - name: single product archive
        run: |
          # the ramdeploy boot set (bundle minus the multi-GB blob, which
          # stays reproducible from these products)
          if [ -d products/kernel/ramdeploy ]; then
            mkdir -p products/ramdeploy-bootset
            cp products/kernel/ramdeploy/{bootcfg,kernel,dtb,initrd,initrd_debug}_ramdeploy.bin \
               products/ramdeploy-bootset/ 2>/dev/null || true
            cp products/bootloader/TestBootApp.efi products/ramdeploy-bootset/ 2>/dev/null || true
            cp products/kernel/tools/deployclient products/ramdeploy-bootset/ 2>/dev/null || true
          fi
          mkdir -p dist
          tar --use-compress-program='zstd -3 -T0' \
              -cf "dist/iceland-main-build-${GITHUB_SHA}.tar.zst" -C products .
          ( cd dist && sha256sum *.tar.zst > SHA256SUMS.archive )
          du -h dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: iceland-main-build-${{ github.sha }}
          retention-days: 14
          compression-level: 0     # payload is already zstd
          path: dist
